# Copy this file to:
# ~/.config/claude-code-pixoo-bridge/config.toml

host = "127.0.0.1"
port = 8765
log_level = "info"

# When device_mac is set, pixoo-bridge automatically defaults to
# transport = "macos-bluetooth".
device_mac = "AA:BB:CC:DD:EE:FF"
device_channel = 1
bluetooth_packet_gap_ms = 30
bluetooth_settle_ms = 500
# brightness_percent = 5
usage_label = "S"
status_dot_enabled = true
# mascot_asset_path = "/absolute/path/to/clawd.png"

# The bottom usage band is fed by the `openusage` binary, polled in the
# background. Leave openusage_binary unset to search the usual install
# locations. openusage caches its own upstream fetch for about five minutes,
# so polling faster than that mostly re-reads its cache.
openusage_enabled = true
openusage_poll_seconds = 60
# openusage_binary = "/usr/local/bin/openusage"
